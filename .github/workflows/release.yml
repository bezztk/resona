name: Release Resona

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Validate release version
        id: version
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}" -replace '^v', ''
          [xml] $project = Get-Content "src/Resona/Resona.csproj"
          $projectVersion = $project.Project.PropertyGroup.Version

          if ([string]::IsNullOrWhiteSpace($projectVersion)) {
            throw "Resona.csproj does not define a Version."
          }

          if ($tagVersion -ne $projectVersion) {
            throw "Tag version '$tagVersion' does not match Resona.csproj version '$projectVersion'."
          }

          "version=$tagVersion" >> $env:GITHUB_OUTPUT

      - name: Restore application
        run: dotnet restore src/Resona/Resona.csproj -r win-x64

      - name: Publish Windows x64 application
        run: >-
          dotnet publish src/Resona/Resona.csproj
          -c Release
          -r win-x64
          --self-contained true
          --no-restore
          -o .release-publish
          -p:Version=${{ steps.version.outputs.version }}
          -p:PublishSingleFile=false

      - name: Install Velopack CLI
        run: dotnet tool install --global vpk --version 1.2.161

      - name: Download previous release
        continue-on-error: true
        env:
          VPK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          vpk download github
          --repoUrl https://github.com/${{ github.repository }}
          --outputDir Releases

      - name: Build system installer and update packages
        run: >-
          vpk pack
          --packId Resona
          --packTitle Resona
          --packAuthors bezztk
          --packVersion ${{ steps.version.outputs.version }}
          --packDir .release-publish
          --mainExe Resona.exe
          --icon src/Resona/Assets/headphones.ico
          --outputDir Releases
          --msi
          --instLocation PerMachine
          --noPortable

      - name: Remove per-user installer from release assets
        shell: pwsh
        run: |
          $assetsPath = "Releases/assets.win.json"
          $assets = @(Get-Content $assetsPath -Raw | ConvertFrom-Json)
          $systemAssets = @($assets | Where-Object Type -ne "Installer")
          $json = ConvertTo-Json -InputObject $systemAssets -Compress
          [System.IO.File]::WriteAllText($assetsPath, $json)

          $setupPath = "Releases/Resona-win-Setup.exe"
          if (Test-Path -LiteralPath $setupPath) {
            Remove-Item -LiteralPath $setupPath
          }

      - name: Publish GitHub release
        env:
          VPK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          vpk upload github
          --repoUrl https://github.com/${{ github.repository }}
          --outputDir Releases
          --publish
          --releaseName "Resona ${{ steps.version.outputs.version }}"
          --tag ${{ github.ref_name }}

  release-linux:
    needs: release-windows
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Validate release version
        id: version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          project_version="$(dotnet msbuild src/Resona/Resona.csproj -getProperty:Version -nologo -p:RuntimeIdentifier=linux-x64)"

          if [[ -z "$project_version" ]]; then
            echo "Resona.csproj does not define a Version." >&2
            exit 1
          fi

          if [[ "$tag_version" != "$project_version" ]]; then
            echo "Tag version '$tag_version' does not match Resona.csproj version '$project_version'." >&2
            exit 1
          fi

          echo "version=$tag_version" >> "$GITHUB_OUTPUT"

      - name: Restore application
        run: dotnet restore src/Resona/Resona.csproj -r linux-x64 -p:RuntimeIdentifier=linux-x64

      - name: Publish Linux x64 application
        run: >-
          dotnet publish src/Resona/Resona.csproj
          -c Release
          -r linux-x64
          --self-contained true
          --no-restore
          -o .release-publish-linux
          -p:Version=${{ steps.version.outputs.version }}
          -p:PublishSingleFile=false

      - name: Install Velopack CLI
        run: dotnet tool install --global vpk --version 1.2.161

      - name: Download previous Linux release
        continue-on-error: true
        env:
          VPK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          vpk download github
          --repoUrl https://github.com/${{ github.repository }}
          --outputDir Releases-Linux
          --channel linux

      - name: Build Linux AppImage and update packages
        run: >-
          vpk pack
          --packId Resona
          --packTitle Resona
          --packAuthors bezztk
          --packVersion ${{ steps.version.outputs.version }}
          --packDir .release-publish-linux
          --mainExe Resona
          --icon src/Resona/Assets/music.png
          --outputDir Releases-Linux
          --runtime linux-x64
          --categories "Audio;Music"

      - name: Add Linux assets to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release upload "${{ github.ref_name }}"
          "Releases-Linux/Resona.AppImage"
          "Releases-Linux/Resona-${{ steps.version.outputs.version }}-linux-full.nupkg"
          --repo "${{ github.repository }}"
          --clobber
