services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-resona}
      POSTGRES_USER: ${POSTGRES_USER:-resona}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: src/Resona.Cloud.Server/Dockerfile
      network: host
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-resona};Username=${POSTGRES_USER:-resona};Password=${POSTGRES_PASSWORD}
      MediaStoragePath: /app/data/media
    volumes:
      - resona-media:/app/data/media
    ports:
      - "127.0.0.1:${RESONA_API_PORT:-5080}:8080"

  analyzer:
    build:
      context: ../..
      dockerfile: src/AnalysisServer/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      ANALYZER_HOST: 0.0.0.0
      ANALYZER_PORT: 8000
      MAX_CONCURRENT_ANALYSES: ${MAX_CONCURRENT_ANALYSES:-1}
      ANALYSIS_TIMEOUT_SECONDS: ${ANALYSIS_TIMEOUT_SECONDS:-1800}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-1073741824}
      MUSIC_API_KEY: ${MUSIC_API_KEY:-}
    ports:
      - "127.0.0.1:${RESONA_ANALYZER_PORT:-5081}:8000"

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
      - analyzer
    ports:
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./tls/server.crt:/etc/nginx/tls/server.crt:ro
      - ./tls/server.key:/etc/nginx/tls/server.key:ro

  dns:
    image: coredns/coredns:1.12.1
    restart: unless-stopped
    command: -conf /etc/coredns/Corefile
    ports:
      - "53:53/tcp"
      - "53:53/udp"
    volumes:
      - ./Corefile:/etc/coredns/Corefile:ro

volumes:
  postgres-data:
  resona-media:
